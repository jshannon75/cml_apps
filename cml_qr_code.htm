<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator for CML</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #EDE5E4 0%, #6B1706 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #1F0603;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4F7B82;
        }

        .size-group {
            margin-bottom: 20px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4F7B82;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4F7B82;
            cursor: pointer;
            border: none;
        }

        .size-value {
            color: #4F7B82;
            font-weight: 600;
        }

        .color-group {
            margin-bottom: 25px;
        }

        .color-row {
            display: flex;
            gap: 15px;
        }

        .color-field {
            flex: 1;
        }

        .color-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid #1F0603;
            border-radius: 10px;
            padding: 8px 12px;
            transition: border-color 0.3s;
        }

        .color-input-wrapper:focus-within {
            border-color: #4F7B82;
        }

        input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            padding: 0;
            cursor: pointer;
            background: none;
            -webkit-appearance: none;
            flex-shrink: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 6px;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .hex-input {
            border: none !important;
            padding: 0 !important;
            font-size: 0.95rem;
            font-family: monospace;
            color: #333;
            width: 80px;
            background: transparent;
        }

        .hex-input:focus {
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4F7B82;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 123, 130, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .download-btn {
            background: #f5576c;
            margin-top: 15px;
        }

        .download-btn:hover {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .download-btn:disabled:hover {
            box-shadow: none;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        #qrcode canvas,
        #qrcode img {
            border-radius: 8px;
            max-width: 100%;
        }

        .empty-state {
            color: #999;
            text-align: center;
        }

        #tempQrHolder {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>
        <p class="subtitle">Enter text or URL to create your QR code.</p>
        
        <div class="input-group">
            <label for="text">Text or URL</label>
            <input type="text" id="text" placeholder="https://communitymappinglab.org" value="https://communitymappinglab.org">
        </div>

        <div class="input-group">
            <label for="labelText">Bottom Label Text (Optional)</label>
            <input type="text" id="labelText" placeholder="e.g. Scan to Visit" value="Community Mapping Lab">
        </div>

        <div class="size-group">
            <label>Label Text Size: <span class="size-value" id="textSizeValue">16</span>px</label>
            <input type="range" id="textSize" min="10" max="48" value="16" step="2">
        </div>

        <div class="size-group">
            <label>QR Size: <span class="size-value" id="sizeValue">256</span>px</label>
            <input type="range" id="size" min="128" max="512" value="256" step="32">
        </div>

        <div class="color-group">
            <label>Colors</label>
            <div class="color-row">
                <div class="color-field">
                    <label style="font-size:0.8rem; margin-bottom:5px;">Foreground</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="fgColorPicker" value="#1F0603">
                        <input type="text" class="hex-input" id="fgHex" value="#1F0603" maxlength="7" placeholder="#000000">
                    </div>
                </div>
                <div class="color-field">
                    <label style="font-size:0.8rem; margin-bottom:5px;">Background</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="bgColorPicker" value="#ffffff">
                        <input type="text" class="hex-input" id="bgHex" value="#ffffff" maxlength="7" placeholder="#ffffff">
                    </div>
                </div>
            </div>
        </div>

        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode">
            <div class="empty-state">Your QR code will appear here</div>
        </div>

        <!-- Hidden container used strictly to generate raw QR before merging label -->
        <div id="tempQrHolder"></div>

        <button class="download-btn" id="downloadBtn" onclick="downloadQR()" disabled>Download PNG</button>
    </div>

    <script>
        // Sync color picker → hex input
        function syncPickerToHex(pickerId, hexId) {
            document.getElementById(pickerId).addEventListener('input', function() {
                document.getElementById(hexId).value = this.value;
            });
        }

        // Sync hex input → color picker
        function syncHexToPicker(hexId, pickerId) {
            document.getElementById(hexId).addEventListener('input', function() {
                const val = this.value;
                if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                    document.getElementById(pickerId).value = val;
                }
            });
        }

        syncPickerToHex('fgColorPicker', 'fgHex');
        syncPickerToHex('bgColorPicker', 'bgHex');
        syncHexToPicker('fgHex', 'fgColorPicker');
        syncHexToPicker('bgHex', 'bgColorPicker');

        function generateQR() {
            const text = document.getElementById('text').value;
            const labelText = document.getElementById('labelText').value.trim();
            const fontSize = parseInt(document.getElementById('textSize').value);
            const size = parseInt(document.getElementById('size').value);
            const fgColor = document.getElementById('fgHex').value;
            const bgColor = document.getElementById('bgHex').value;
            const qrcodeDiv = document.getElementById('qrcode');
            const tempHolder = document.getElementById('tempQrHolder');
            const downloadBtn = document.getElementById('downloadBtn');
            
            if (!text) {
                alert('Please enter text or URL');
                return;
            }

            if (!/^#[0-9A-Fa-f]{6}$/.test(fgColor) || !/^#[0-9A-Fa-f]{6}$/.test(bgColor)) {
                alert('Please enter valid hex color codes (e.g. #1F0603)');
                return;
            }

            tempHolder.innerHTML = '';
            qrcodeDiv.innerHTML = '';

            // 1. Generate base QR code off-screen
            new QRCode(tempHolder, {
                text: text,
                width: size,
                height: size,
                colorDark: fgColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });

            // Allow QRCode library time to append image/canvas DOM element
            setTimeout(() => {
                const qrElement = tempHolder.querySelector('canvas') || tempHolder.querySelector('img');
                if (!qrElement) return;

                // Calculate Canvas Height with Text Padding
                const padding = 15;
                const textMargin = labelText ? (fontSize + padding) : 0;
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = size;
                finalCanvas.height = size + textMargin;

                const ctx = finalCanvas.getContext('2d');

                // Fill Background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

                // Draw QR Code
                ctx.drawImage(qrElement, 0, 0, size, size);

                // Draw Label Text
                if (labelText) {
                    ctx.fillStyle = fgColor;
                    ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(labelText, size / 2, size + (textMargin / 2));
                }

                qrcodeDiv.appendChild(finalCanvas);
                downloadBtn.disabled = false;
            }, 100);
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;

            const link = document.createElement('a');
            link.download = 'qrcode-with-text.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('size').addEventListener('input', function() {
            document.getElementById('sizeValue').textContent = this.value;
        });

        document.getElementById('textSize').addEventListener('input', function() {
            document.getElementById('textSizeValue').textContent = this.value;
        });

        document.getElementById('text').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        document.getElementById('labelText').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        window.onload = function() {
            generateQR();
        };
    </script>
</body>
</html>
